<!DOCTYPE html>
<!-- THROWAWAY SPIKE: voice transcription lab. Not linked from the site. Delete after the experiment. -->
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Voice Lab — experimento</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #222; margin: 0; padding: 16px; max-width: 760px; margin-inline: auto; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p.sub { margin: 0 0 14px; color: #666; font-size: 13px; }
    fieldset { border: 1px solid #ddd; border-radius: 8px; background: #fff; margin: 0 0 12px; padding: 10px 12px; }
    legend { font-size: 12px; color: #666; padding: 0 6px; }
    label { display: block; font-size: 13px; color: #555; margin: 6px 0 2px; }
    input[type=text], input[type=password], select, textarea { width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; font-family: inherit; }
    textarea { min-height: 76px; resize: vertical; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    .row > * { flex: 1; min-width: 160px; }
    .check { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-top: 8px; }
    .check input { width: auto; }
    #talk { width: 100%; padding: 26px 10px; margin: 6px 0 12px; font-size: 18px; font-weight: 600; border: none; border-radius: 14px; background: #4a4a8a; color: #fff; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; }
    #talk.rec { background: #c0392b; }
    #talk:disabled { background: #aaa; }
    .cards { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @media (min-width: 640px) { .cards { grid-template-columns: 1fr 1fr; } }
    .card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 10px 12px; }
    .card h2 { font-size: 14px; margin: 0 0 6px; }
    .meta { font-size: 12px; color: #777; margin-top: 4px; min-height: 16px; }
    .err { color: #b00020; }
    #log { font-size: 12px; font-family: ui-monospace, monospace; background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 8px 10px; margin-top: 12px; white-space: pre-wrap; max-height: 220px; overflow-y: auto; }
  </style>
</head>
<body>
  <h1>Voice Lab</h1>
  <p class="sub">Experimento descartable: compara el reconocimiento de Safari con Whisper (Cloudflare). Mantén presionado el botón, habla y suelta.</p>

  <fieldset>
    <legend>Configuración</legend>
    <label for="key">Clave del lab</label>
    <input id="key" type="password" autocomplete="off" />
    <div class="row">
      <div>
        <label for="prompt">Pista de vocabulario para Whisper (ej. nombre del juego)</label>
        <input id="prompt" type="text" placeholder="Ej: Pandemic Legacy, meeple, mazo de jugador" />
      </div>
      <div>
        <label for="locale">Idioma de Safari</label>
        <select id="locale">
          <option value="es-CO">es-CO (Colombia)</option>
          <option value="es-MX">es-MX (México)</option>
          <option value="es-ES">es-ES (España)</option>
        </select>
      </div>
      <div>
        <label for="mode">Qué probar</label>
        <select id="mode">
          <option value="both">Ambos a la vez</option>
          <option value="safari">Solo Safari</option>
          <option value="whisper">Solo Whisper</option>
        </select>
      </div>
    </div>
    <div class="check"><input id="forceWav" type="checkbox" /><label for="forceWav" style="margin:0">Enviar siempre como WAV 16 kHz (si no, envío el formato original y reintento como WAV si falla)</label></div>
  </fieldset>

  <fieldset>
    <legend>Frase de referencia (opcional, para medir errores)</legend>
    <textarea id="ref" placeholder="Escribe lo que vas a decir, tal cual. Si lo llenas, se calcula el % de palabras erradas de cada motor."></textarea>
  </fieldset>

  <button id="talk" type="button">Mantén presionado para hablar</button>

  <div class="cards">
    <div class="card">
      <h2>Safari (webkitSpeechRecognition)</h2>
      <textarea id="outSafari" placeholder="El texto aparece aquí; puedes editarlo"></textarea>
      <div class="meta" id="metaSafari"></div>
    </div>
    <div class="card">
      <h2>Whisper large-v3-turbo (Cloudflare)</h2>
      <textarea id="outWhisper" placeholder="El texto aparece aquí; puedes editarlo"></textarea>
      <div class="meta" id="metaWhisper"></div>
    </div>
  </div>

  <div id="log"></div>

<script>
  const MAX_SECONDS = 30;
  const $ = (id) => document.getElementById(id);
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  // ── persisted settings ──
  const store = {
    get(k) { try { return localStorage.getItem(k) || ''; } catch { return ''; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  ['key', 'prompt', 'locale', 'mode'].forEach((id) => {
    $(id).value = store.get('lab_' + id) || $(id).value;
    $(id).addEventListener('change', () => store.set('lab_' + id, $(id).value));
    $(id).addEventListener('input', () => store.set('lab_' + id, $(id).value));
  });

  function log(msg) {
    const t = new Date().toLocaleTimeString();
    $('log').textContent += `[${t}] ${msg}\n`;
    $('log').scrollTop = $('log').scrollHeight;
  }
  function setMeta(id, text, isErr) {
    $(id).textContent = text;
    $(id).className = 'meta' + (isErr ? ' err' : '');
  }

  // ── word error rate ──
  function words(s) {
    return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9ñ\s]/g, ' ').split(/\s+/).filter(Boolean);
  }
  function wer(ref, hyp) {
    const r = words(ref), h = words(hyp);
    if (!r.length) return null;
    const d = Array.from({ length: r.length + 1 }, (_, i) => [i, ...Array(h.length).fill(0)]);
    for (let j = 0; j <= h.length; j++) d[0][j] = j;
    for (let i = 1; i <= r.length; i++)
      for (let j = 1; j <= h.length; j++)
        d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (r[i - 1] === h[j - 1] ? 0 : 1));
    return Math.round((d[r.length][h.length] / r.length) * 100);
  }
  function reportWer() {
    const ref = $('ref').value.trim();
    if (!ref) return;
    const s = wer(ref, $('outSafari').value), w = wer(ref, $('outWhisper').value);
    log(`Errores vs referencia → Safari: ${s ?? '-'}% · Whisper: ${w ?? '-'}%  (se actualiza cuando llegan ambos)`);
  }

  // ── WAV conversion (16 kHz mono 16-bit) ──
  async function toWav16k(blob) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx();
    try {
      const decoded = await ctx.decodeAudioData(await blob.arrayBuffer());
      const length = Math.ceil(decoded.duration * 16000);
      const off = new OfflineAudioContext(1, length, 16000);
      const src = off.createBufferSource();
      src.buffer = decoded;
      src.connect(off.destination);
      src.start();
      const rendered = await off.startRendering();
      const pcm = rendered.getChannelData(0);
      const buf = new ArrayBuffer(44 + pcm.length * 2);
      const v = new DataView(buf);
      const str = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
      str(0, 'RIFF'); v.setUint32(4, 36 + pcm.length * 2, true); str(8, 'WAVE'); str(12, 'fmt ');
      v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
      v.setUint32(24, 16000, true); v.setUint32(28, 32000, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
      str(36, 'data'); v.setUint32(40, pcm.length * 2, true);
      for (let i = 0; i < pcm.length; i++) {
        const s = Math.max(-1, Math.min(1, pcm[i]));
        v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);
      }
      return new Blob([buf], { type: 'audio/wav' });
    } finally { ctx.close(); }
  }

  // ── Whisper call ──
  async function postAudio(blob) {
    const q = $('prompt').value.trim();
    const res = await fetch('/api/lab/transcribe' + (q ? '?prompt=' + encodeURIComponent(q) : ''), {
      method: 'POST',
      headers: { 'X-Lab-Key': $('key').value, 'Content-Type': blob.type || 'application/octet-stream' },
      body: blob,
    });
    const data = await res.json().catch(() => ({}));
    return { ok: res.ok, status: res.status, data };
  }

  async function runWhisper(blob) {
    setMeta('metaWhisper', 'Transcribiendo…');
    const t0 = performance.now();
    let sentAs = blob.type || 'desconocido', note = '';
    try {
      let r;
      if ($('forceWav').checked) {
        const wav = await toWav16k(blob);
        sentAs = 'audio/wav (forzado)';
        r = await postAudio(wav);
      } else {
        r = await postAudio(blob);
        if (!r.ok && r.status === 502) {
          log(`Whisper falló con el formato original (${r.data.error}); reintentando como WAV…`);
          const wav = await toWav16k(blob);
          sentAs = 'audio/wav (reintento)';
          note = ' — el original falló';
          r = await postAudio(wav);
        }
      }
      if (!r.ok) {
        const hint = r.status === 401 ? 'clave incorrecta' : r.status === 503 ? 'lab no configurado en el Worker' : (r.data.error || 'error');
        setMeta('metaWhisper', `Error ${r.status}: ${hint}`, true);
        log(`Whisper error ${r.status}: ${JSON.stringify(r.data)}`);
        return;
      }
      $('outWhisper').value = r.data.text;
      setMeta('metaWhisper', `${Math.round(performance.now() - t0)} ms total · enviado como ${sentAs}${note} · ${Math.round(blob.size / 1024)} KB grabados`);
      log(`Whisper (${sentAs}${note}): "${r.data.text}"`);
      reportWer();
    } catch (e) {
      setMeta('metaWhisper', 'Error: ' + e.message, true);
      log('Whisper excepción: ' + e.message);
    }
  }

  // ── Recording ──
  let stream = null, recorder = null, recognition = null, chunks = [], recording = false, wantStop = false, timer = null, safariText = '';

  function pickMime() {
    const cands = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/webm'];
    return cands.find((m) => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
  }

  async function startRec() {
    if (recording) return;
    recording = true; wantStop = false;
    const mode = $('mode').value;
    const useSafari = mode !== 'whisper', useWhisper = mode !== 'safari';
    $('talk').classList.add('rec'); $('talk').textContent = 'Grabando… suelta para terminar';
    safariText = '';
    if (useSafari) { $('outSafari').value = ''; setMeta('metaSafari', ''); }
    if (useWhisper) { $('outWhisper').value = ''; setMeta('metaWhisper', ''); }

    try {
      if (!stream) stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      log('Micrófono no disponible: ' + e.message);
      setMeta('metaWhisper', 'Sin permiso de micrófono', true);
      return resetUi();
    }
    if (wantStop) return resetUi(); // released while the permission prompt was showing

    const t0 = performance.now();
    if (useWhisper) {
      const mime = pickMime();
      chunks = [];
      const rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
      recorder = rec;
      rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
      rec.onerror = (e) => { log('MediaRecorder error: ' + (e.error && e.error.message)); setMeta('metaWhisper', 'Error de grabación', true); };
      rec.onstop = () => {
        try {
          // use the local `rec`: the shared `recorder` is already null by the time this fires
          const blob = new Blob(chunks, { type: rec.mimeType || mime || 'audio/mp4' });
          log(`Grabado: ${blob.type}, ${Math.round(blob.size / 1024)} KB, ${((performance.now() - t0) / 1000).toFixed(1)} s`);
          if (blob.size < 1000) return setMeta('metaWhisper', 'Audio demasiado corto', true);
          runWhisper(blob);
        } catch (e) {
          log('Error procesando la grabación: ' + e.message);
          setMeta('metaWhisper', 'Error: ' + e.message, true);
        }
      };
      rec.start();
    }
    if (useSafari) {
      if (!SR) {
        setMeta('metaSafari', 'Este navegador no soporta SpeechRecognition', true);
      } else {
        recognition = new SR();
        recognition.lang = $('locale').value;
        recognition.interimResults = true;
        recognition.continuous = true;
        recognition.onresult = (e) => {
          let finals = '', interim = '';
          for (let i = 0; i < e.results.length; i++) {
            (e.results[i].isFinal ? (finals += e.results[i][0].transcript) : (interim += e.results[i][0].transcript));
          }
          safariText = finals;
          $('outSafari').value = (finals + interim).trim();
        };
        recognition.onerror = (e) => { setMeta('metaSafari', 'Error: ' + e.error, true); log('Safari error: ' + e.error); };
        recognition.onend = () => {
          if (!$('metaSafari').classList.contains('err')) {
            setMeta('metaSafari', `${Math.round(performance.now() - t0)} ms hasta el final`);
          }
          log(`Safari: "${$('outSafari').value}"`);
          reportWer();
        };
        try { recognition.start(); } catch (e) { setMeta('metaSafari', 'No pudo iniciar: ' + e.message, true); }
      }
    }
    timer = setTimeout(stopRec, MAX_SECONDS * 1000);
  }

  function stopRec() {
    wantStop = true;
    clearTimeout(timer);
    if (!recording) return;
    if (recorder && recorder.state !== 'inactive') recorder.stop();
    if (recognition) { try { recognition.stop(); } catch {} }
    recorder = null; recognition = null;
    resetUi();
  }
  function resetUi() {
    recording = false;
    $('talk').classList.remove('rec'); $('talk').textContent = 'Mantén presionado para hablar';
  }

  const talk = $('talk');
  talk.addEventListener('pointerdown', (e) => { e.preventDefault(); talk.setPointerCapture(e.pointerId); startRec(); });
  ['pointerup', 'pointercancel'].forEach((ev) => talk.addEventListener(ev, (e) => { e.preventDefault(); stopRec(); }));
  talk.addEventListener('contextmenu', (e) => e.preventDefault());

  // Show the WER once Whisper text also arrives / after edits.
  ['outSafari', 'outWhisper', 'ref'].forEach((id) => $(id).addEventListener('input', () => {
    const ref = $('ref').value.trim();
    if (!ref) return;
    log(`Errores vs referencia → Safari: ${wer(ref, $('outSafari').value) ?? '-'}% · Whisper: ${wer(ref, $('outWhisper').value) ?? '-'}%`);
  }));

  log(SR ? 'SpeechRecognition disponible.' : 'SpeechRecognition NO disponible en este navegador.');
  log(`MediaRecorder: ${window.MediaRecorder ? 'sí' : 'no'}; formato elegido: ${pickMime() || '(por defecto)'}`);
</script>
</body>
</html>
