name: Update gamecache.sqlite.gz with BGG data

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  index:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # lets the automatic GITHUB_TOKEN create/update releases
    steps:
      - name: Check BGG token present
        env:
          GAMECACHE_BGG_TOKEN: ${{ secrets.GAMECACHE_BGG_TOKEN }}
        run: |
          if [ -z "$GAMECACHE_BGG_TOKEN" ]; then
            echo "::warning::GAMECACHE_BGG_TOKEN not set; BGG authentication may fail." >&2
          fi
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Build & index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GAMECACHE_BGG_TOKEN: ${{ secrets.GAMECACHE_BGG_TOKEN }}
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          python scripts/download_and_index.py --debug
