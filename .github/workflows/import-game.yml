name: Import game to wiki

on:
  workflow_dispatch:
    inputs:
      bgg_id:
        description: 'unused in this temporary token-check version'
        required: false
        type: string
        default: '0'

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mybgg-wiki (content)
        uses: actions/checkout@v7
        with:
          repository: chardila/mybgg-wiki
          path: wiki
          ssh-key: ${{ secrets.WIKI_DEPLOY_KEY }}

      - name: Confirm push access works
        run: |
          cd wiki
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          echo "deploy-key-check $(date -u +%s)" >> .deploy-key-check
          git add .deploy-key-check
          git commit -m "test: deploy key push check (throwaway)"
          git push
          echo "Push succeeded — WIKI_DEPLOY_KEY has write access."
